<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Scroll Horizontal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Contenedor principal del scroll */
        .scroll-container {
            display: flex;
            gap: 20px;
            width: 90%;
            max-width: 1200px;
            padding: 20px;
            overflow-x: auto;
            scroll-behavior: smooth;
            /* Efecto de "snapping" para que las tarjetas se alineen solas al scrollear */
            scroll-snap-type: x mandatory;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Estilo para las tarjetas/ítems */
        .scroll-item {
            flex: 0 0 300px; /* No se encogen, no crecen, base de 300px */
            height: 400px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            scroll-snap-align: start;
            transition: transform 0.3s ease;
        }

        .scroll-item:hover {
            transform: scale(1.02);
        }

        /* Personalización de la barra de scroll (opcional, para que se vea más bonita) */
        .scroll-container::-webkit-scrollbar {
            height: 8px;
        }

        .scroll-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .scroll-container::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }

        .scroll-container::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>

    <h1>Galería Horizontal</h1>

    <div class="scroll-container">
        <div class="scroll-item">Ítem 1</div>
        <div class="scroll-item">Ítem 2</div>
        <div class="scroll-item">Ítem 3</div>
        <div class="scroll-item">Ítem 4</div>
        <div class="scroll-item">Ítem 5</div>
        <div class="scroll-item">Ítem 6</div>
    </div>

</body>
</html>
