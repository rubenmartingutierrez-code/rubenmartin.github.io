<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Horizontal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #111;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .scroll-container {
            width: 100%;
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
        }

        .scroll-content {
            display: flex;
            height: 100vh;
            width: max-content;
        }

        .scroll-item {
            flex: 0 0 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: clamp(24px, 8vw, 64px);
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .scroll-item:nth-child(1) {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .scroll-item:nth-child(2) {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .scroll-item:nth-child(3) {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .scroll-item:nth-child(4) {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .scroll-item:nth-child(5) {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .scroll-item:nth-child(6) {
            background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
        }

        .scroll-item:nth-child(7) {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .scroll-item:nth-child(8) {
            background: linear-gradient(135deg, #ff9a56 0%, #ff6a88 100%);
        }

        .scroll-item:hover {
            transform: scale(1.02);
        }

        /* Estilos para el personaje - SPRITE SHEET ANIMATION */
        .character {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 188px;
            height: 329px;
            background-image: url('https://raw.githubusercontent.com/rubenmartingutierrez-code/rubenmartin.github.io/main/avatar%20andando2.png');
            background-size: 1316px 329px;
            background-position: 0 0;
            background-repeat: no-repeat;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        /* Animación del sprite sheet - 7 fotogramas */
        .character.walking {
            animation: spriteAnimation 0.7s steps(7, end) infinite;
        }

        @keyframes spriteAnimation {
            0% { background-position: 0 0; }
            14.28% { background-position: -188px 0; }
            28.56% { background-position: -376px 0; }
            42.84% { background-position: -564px 0; }
            57.12% { background-position: -752px 0; }
            71.4% { background-position: -940px 0; }
            85.68% { background-position: -1128px 0; }
            100% { background-position: -1128px 0; }
        }

        /* Personalizar scrollbar */
        .scroll-container::-webkit-scrollbar {
            height: 8px;
        }

        .scroll-container::-webkit-scrollbar-track {
            background: #333;
        }

        .scroll-container::-webkit-scrollbar-thumb {
            background: #666;
            border-radius: 4px;
        }

        .scroll-container::-webkit-scrollbar-thumb:hover {
            background: #888;
        }
    </style>
</head>
<body>
    <div class="character" id="character"></div>

    <div class="scroll-container" id="scrollContainer">
        <div class="scroll-content">
            <div class="scroll-item">Item 1</div>
            <div class="scroll-item">Item 2</div>
            <div class="scroll-item">Item 3</div>
            <div class="scroll-item">Item 4</div>
            <div class="scroll-item">Item 5</div>
            <div class="scroll-item">Item 6</div>
            <div class="scroll-item">Item 7</div>
            <div class="scroll-item">Item 8</div>
        </div>
    </div>

    <script>
        const scrollContainer = document.getElementById('scrollContainer');
        const character = document.getElementById('character');

        let scrollTimeout;

        scrollContainer.addEventListener('wheel', (e) => {
            e.preventDefault();
            scrollContainer.scrollLeft += e.deltaY;
        });

        scrollContainer.addEventListener('scroll', () => {
            // Activar animación del sprite sheet
            character.classList.add('walking');

            // Limpiar el timeout anterior
            clearTimeout(scrollTimeout);

            // Detener la animación después de 600ms sin scroll
            scrollTimeout = setTimeout(() => {
                character.classList.remove('walking');
            }, 600);
        });
    </script>
</body>
</html>
