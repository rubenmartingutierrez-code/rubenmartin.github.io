<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubén Martín</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #111;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .scroll-container {
            width: 100%;
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
        }

        .scroll-content {
            display: flex;
            height: 100vh;
            width: max-content;
        }

        .scroll-item {
            flex: 0 0 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: clamp(24px, 8vw, 64px);
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .scroll-item:nth-child(1) {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .scroll-item:nth-child(2) {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .scroll-item:nth-child(3) {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .scroll-item:nth-child(4) {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .scroll-item:nth-child(5) {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .scroll-item:nth-child(6) {
            background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
        }

        .scroll-item:nth-child(7) {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .scroll-item:nth-child(8) {
            background: linear-gradient(135deg, #ff9a56 0%, #ff6a88 100%);
        }

        .scroll-item:hover {
            transform: scale(1.02);
        }

        /* Estilos para el personaje - CENTRADO, SIN DESPLAZAMIENTO */
        .character {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        /* Personalizar scrollbar */
        .scroll-container::-webkit-scrollbar {
            height: 8px;
        }

        .scroll-container::-webkit-scrollbar-track {
            background: #333;
        }

        .scroll-container::-webkit-scrollbar-thumb {
            background: #666;
            border-radius: 4px;
        }

        .scroll-container::-webkit-scrollbar-thumb:hover {
            background: #888;
        }
    </style>
</head>
<body>
    <div class="character" id="character"></div>

    <div class="scroll-container" id="scrollContainer">
        <div class="scroll-content">
            <div class="scroll-item">Rubén Martín Gutiérrez</div>
            <div class="scroll-item">Item 2</div>
            <div class="scroll-item">Item 3</div>
            <div class="scroll-item">Item 4</div>
            <div class="scroll-item">Item 5</div>
            <div class="scroll-item">Item 6</div>
            <div class="scroll-item">Item 7</div>
            <div class="scroll-item">Item 8</div>
        </div>
    </div>

    <script>
        const scrollContainer = document.getElementById('scrollContainer');
        const character = document.getElementById('character');

        // GIFs de Sonic
        const sonicCorriendo = 'https://raw.githubusercontent.com/rubenmartingutierrez-code/rubenmartin.github.io/main/avatarwalking.gif';
        const sonicParado = 'https://raw.githubusercontent.com/rubenmartingutierrez-code/rubenmartin.github.io/main/sonicparado.gif';

        // Inicialmente mostrar Sonic parado
        character.style.backgroundImage = `url('${sonicParado}')`;

        let scrollTimeout;

        scrollContainer.addEventListener('wheel', (e) => {
            e.preventDefault();
            scrollContainer.scrollLeft += e.deltaY;
        });

        scrollContainer.addEventListener('scroll', () => {
            // Cambiar a Sonic corriendo
            character.style.backgroundImage = `url('${sonicCorriendo}')`;

            // Limpiar el timeout anterior
            clearTimeout(scrollTimeout);

            // Detener la animación después de 600ms sin scroll
            scrollTimeout = setTimeout(() => {
                // Cambiar a Sonic parado
                character.style.backgroundImage = `url('${sonicParado}')`;
            }, 600);
        });
    </script>
</body>
</html>
