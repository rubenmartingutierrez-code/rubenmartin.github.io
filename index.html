<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Scroll Horizontal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        /* Contenedor principal del scroll */
        .scroll-container {
            display: flex;
            gap: 20px;
            width: 90%;
            max-width: 1200px;
            padding: 30px;
            overflow-x: auto;
            /* Eliminamos 'scroll-behavior: smooth' temporalmente aquí 
               porque JavaScript se encarga de gestionar el movimiento */
            scroll-snap-type: x mandatory;
            background-color: #252525;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Estilo para las tarjetas/ítems */
        .scroll-item {
            flex: 0 0 250px;
            height: 350px;
            background: #333333;
            border: 2px solid #444;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            scroll-snap-align: start;
            transition: all 0.3s ease;
        }

        .scroll-item:hover {
            transform: translateY(-5px);
            border-color: #764ba2;
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        .scroll-item img {
            max-width: 100%;
            max-height: 70%;
            object-fit: contain;
            image-rendering: pixelated; 
        }

        .item-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #e0e0e0;
        }

        /* Personalización de la barra de scroll */
        .scroll-container::-webkit-scrollbar {
            height: 8px;
        }

        .scroll-container::-webkit-scrollbar-track {
            background: #252525;
            border-radius: 10px;
        }

        .scroll-container::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }

        .scroll-container::-webkit-scrollbar-thumb:hover {
            background: #667eea;
        }
    </style>
</head>
<body>

    <h1>Moonwalker Gallery</h1>

    <div class="scroll-container" id="horizontal-scroll">
        <div class="scroll-item">
            <div class="item-title">Paso 1</div>
        </div>
        <div class="scroll-item">
            <div class="item-title">Paso 2</div>
        </div>
        <div class="scroll-item">
            <div class="item-title">Paso 3</div>
        </div>
        <div class="scroll-item">
            <div class="item-title">Paso 4</div>
        </div>
        <div class="scroll-item">
            <div class="item-title">Paso 5</div>
        </div>
        <div class="scroll-item">
            <div class="item-title">Paso 6</div>
        </div>
    </div>

    <script>
        const container = document.getElementById('horizontal-scroll');

        container.addEventListener('wheel', (evt) => {
            // Evita que la página web entera haga scroll hacia abajo
            evt.preventDefault();
            
            // Suma el movimiento vertical de la rueda (deltaY) al scroll horizontal del contenedor
            container.scrollLeft += evt.deltaY;
        });
    </script>

</body>
</html>
